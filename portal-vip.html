<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- ZOOM LIVRE PARA ACESSIBILIDADE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal VIP - RailanTech</title>

<!-- INVISIBILIDADE: Fontes do Google Removidas. Usando Fontes Nativas do Sistema -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
    --bg-principal: #050507; 
    --bg-secundario: rgba(20, 20, 25, 0.6); 
    --bg-modal: #16161a;
    
    --texto-principal: #f8fafc; 
    --texto-secundario: #94a3b8; 
    
    --ouro-puro: #d4af37; 
    --ouro-brilho: #fde047;
    --borda-sutil: rgba(255, 255, 255, 0.08); 
    
    --verde-seguro: #10b981; 
    --vermelho-alerta: #ef4444;
    --amarelo-suspeito: #f59e0b;
    
    --sombra-premium: 0 20px 40px -10px rgba(0,0,0,0.9);
}

* { 
    margin: 0; padding: 0; box-sizing: border-box; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    -webkit-tap-highlight-color: transparent; 
}

body { 
    background-color: var(--bg-principal); 
    color: var(--texto-principal); 
    min-height: 100dvh; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    /* Fundo de radar profundo idêntico à Vitrine */
    background-image: 
        radial-gradient(circle at 50% 0%, #171722 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, #0a0a0f 0%, transparent 50%);
}

h1, h2, .titulo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
input, button { -webkit-appearance: none; outline: none; font-family: inherit; }

.top-bar { 
    width: 100%; padding: 25px 40px; display: flex; justify-content: space-between; 
    align-items: center; border-bottom: 1px solid var(--borda-sutil); 
    background: rgba(5, 5, 7, 0.8); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 100;
}
.btn-voltar { 
    color: var(--texto-secundario); text-decoration: none; font-size: 14px; 
    font-weight: 500; transition: all 0.3s ease; display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.03); padding: 10px 20px; border-radius: 30px; border: 1px solid var(--borda-sutil);
}
.btn-voltar:hover { 
    color: #fff; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); transform: translateX(-3px);
}
.logo-rt {
    color: var(--ouro-puro); font-weight: 800; letter-spacing: 2px; font-size: 15px; 
    display: flex; align-items: center; gap: 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.main-container { 
    width: 100%; max-width: 650px; padding: 50px 20px; display: flex; 
    flex-direction: column; align-items: center; text-align: center; margin-top: 2vh; 
}

.icone-cofre { 
    font-size: 65px; color: var(--ouro-puro); margin-bottom: 25px; 
    filter: drop-shadow(0 15px 25px rgba(212, 175, 55, 0.2)); 
    background: rgba(212, 175, 55, 0.05); width: 120px; height: 120px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    border: 1px solid rgba(212, 175, 55, 0.1);
}

.titulo { 
    color: #fff; font-size: 36px; margin-bottom: 15px; font-weight: 800; 
    letter-spacing: -0.5px; text-shadow: 0 10px 30px rgba(212,175,55,0.3);
}
.subtitulo { 
    color: var(--texto-secundario); font-size: 15px; margin-bottom: 45px; 
    line-height: 1.7; font-weight: 400; max-width: 500px;
}

.caixa-pesquisa { 
    width: 100%; background: var(--bg-secundario); border: 1px solid var(--borda-sutil); 
    border-radius: 20px; padding: 40px; box-shadow: var(--sombra-premium); 
    backdrop-filter: blur(12px); transition: 0.3s;
}
.caixa-pesquisa:hover { border-color: rgba(212, 175, 55, 0.2); }

.label-chave {
    display: block; text-align: left; color: var(--texto-secundario); font-size: 12px;
    text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 10px; padding-left: 5px;
}

.input-chave { 
    width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--borda-sutil); 
    color: var(--ouro-brilho); padding: 20px; border-radius: 14px; font-size: 18px; 
    text-align: center; letter-spacing: 4px; outline: none; transition: all 0.3s; 
    margin-bottom: 25px; font-weight: 700; font-family: 'Courier New', monospace;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
}
.input-chave:focus { 
    border-color: var(--ouro-puro); background: rgba(0,0,0,0.8);
    box-shadow: 0 0 25px rgba(212, 175, 55, 0.15), inset 0 2px 10px rgba(0,0,0,0.5); 
}
.input-chave::placeholder { color: #475569; letter-spacing: 1px; font-weight: 400; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px;}

.btn-consultar { 
    width: 100%; background: linear-gradient(135deg, var(--ouro-puro) 0%, #a68420 100%); 
    color: #000; padding: 20px; border-radius: 14px; font-weight: 800; font-size: 15px; 
    border: none; cursor: pointer; transition: all 0.3s ease; display: flex; 
    justify-content: center; align-items: center; gap: 12px; text-transform: uppercase; 
    letter-spacing: 1px; box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4);
}
.btn-consultar:hover { 
    transform: translateY(-3px); box-shadow: 0 15px 35px -5px rgba(212, 175, 55, 0.6); filter: brightness(1.1);
}
.btn-consultar:disabled { background: #333; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }

#caixa-laudo { 
    display: none; width: 100%; margin-top: 35px; background: rgba(10, 10, 14, 0.9); 
    border: 1px solid var(--borda-sutil); border-left: 4px solid var(--ouro-puro); 
    padding: 30px; border-radius: 16px; text-align: left; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
    box-shadow: var(--sombra-premium); backdrop-filter: blur(10px);
}
.laudo-titulo { 
    color: var(--ouro-puro); font-size: 15px; text-transform: uppercase; margin-bottom: 20px; 
    letter-spacing: 1.5px; font-weight: 800; display: flex; align-items: center; gap: 12px; 
    border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.laudo-texto { 
    color: var(--texto-principal); font-size: 15px; line-height: 1.8; font-weight: 400;
}
.laudo-texto b { color: #fff; font-weight: 600; }

@media (max-width: 768px) {
    .top-bar { padding: 20px; }
    .titulo { font-size: 28px; }
    .caixa-pesquisa { padding: 25px 20px; }
    .input-chave { font-size: 16px; letter-spacing: 2px; padding: 18px; }
}

@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="top-bar">
    <a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Central</a>
    <div class="logo-rt"><i class="fa-solid fa-microchip"></i> RAILANTECH</div>
</div>

<div class="main-container">
    <div class="icone-cofre"><i class="fa-solid fa-vault"></i></div>
    <h1 class="titulo">Portal de Laudos VIP</h1>
    <p class="subtitulo">Insira a sua Chave Oficial de Protocolo gerada no momento da denúncia para descriptografar o laudo da Inteligência Pericial.</p>
    
    <div class="caixa-pesquisa">
        <label class="label-chave">Chave de Acesso (Token)</label>
        <input type="text" id="input-protocolo" class="input-chave" placeholder="Ex: RT-PF-123-456">
        <button class="btn-consultar" id="btn-buscar">
            <i class="fa-solid fa-magnifying-glass"></i> Consultar Laudo
        </button>
    </div>

    <div id="caixa-laudo">
        <div class="laudo-titulo"><i class="fa-solid fa-file-shield"></i> Veredito Oficial</div>
        <div class="laudo-texto" id="texto-resultado"></div>
    </div>
</div>

<script>
// 🚨 MANTENHA A URL EXATA DO SEU CLOUDFLARE AQUI
const API_MATRIZ = "https://motor-osint-privado.analise-seguranca.workers.dev";

// Faz o Enter funcionar no teclado
document.getElementById('input-protocolo').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') buscarLaudo();
});

// Faz o clique do botão funcionar
document.getElementById('btn-buscar').addEventListener('click', buscarLaudo);

async function buscarLaudo() {
    const inputChave = document.getElementById('input-protocolo');
    const chave = inputChave.value.trim().toUpperCase();
    const caixaLaudo = document.getElementById('caixa-laudo');
    const textoResultado = document.getElementById('texto-resultado');
    const btnBuscar = document.getElementById('btn-buscar');

    if (!chave) {
        // Notificação Visual Clean
        const textoOriginal = btnBuscar.innerHTML;
        btnBuscar.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Digite a Chave Oficial';
        btnBuscar.style.background = 'var(--vermelho-alerta)';
        btnBuscar.style.color = '#fff';
        setTimeout(() => {
            btnBuscar.innerHTML = textoOriginal;
            btnBuscar.style.background = 'linear-gradient(135deg, var(--ouro-puro) 0%, #a68420 100%)';
            btnBuscar.style.color = '#000';
        }, 3000);
        return;
    }

    // Efeito visual de processamento militar
    btnBuscar.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> ABRINDO O COFRE...';
    btnBuscar.disabled = true;
    caixaLaudo.style.display = 'none';

    try {
        // Envia a chave para o Cloudflare investigar
        const req = await fetch(API_MATRIZ + "?protocolo=" + encodeURIComponent(chave), {
            method: "GET"
        });
        const res = await req.json();
        
        caixaLaudo.style.display = 'block';
        
        if (req.ok) {
            if (res.laudo) {
                // ✅ CENÁRIO 1: O Laudo está pronto!
                caixaLaudo.style.borderLeftColor = "var(--verde-seguro)";
                caixaLaudo.style.boxShadow = "0 10px 30px rgba(16, 185, 129, 0.1)";
                document.querySelector('.laudo-titulo').innerHTML = '<i class="fa-solid fa-check-double"></i> Laudo Oficial Concluído';
                document.querySelector('.laudo-titulo').style.color = "var(--verde-seguro)";
                textoResultado.innerHTML = res.laudo.replace(/\n/g, '<br>');
            
            } else if (res.status === "em_analise") {
                // ⏳ CENÁRIO 2: A chave existe, mas o Diretor ainda não deu o veredito
                caixaLaudo.style.borderLeftColor = "var(--ouro-puro)";
                caixaLaudo.style.boxShadow = "0 10px 30px rgba(212, 175, 55, 0.1)";
                document.querySelector('.laudo-titulo').innerHTML = '<i class="fa-solid fa-hourglass-half"></i> Em Análise Pericial';
                document.querySelector('.laudo-titulo').style.color = "var(--ouro-puro)";
                textoResultado.innerHTML = "O seu dossiê encontra-se na mesa de operações. O caso exige análise profunda e cruzamento de dados. Por favor, retorne e consulte a chave mais tarde.";
            }
        } else {
            // ❌ CENÁRIO 3: A pessoa digitou a chave errada
            caixaLaudo.style.borderLeftColor = "var(--vermelho-alerta)";
            caixaLaudo.style.boxShadow = "0 10px 30px rgba(239, 68, 68, 0.1)";
            document.querySelector('.laudo-titulo').innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Chave Inválida ou Não Encontrada';
            document.querySelector('.laudo-titulo').style.color = "var(--vermelho-alerta)";
            textoResultado.innerHTML = "Não localizámos nenhum dossiê ou laudo associado a esta chave. Verifique se digitou o protocolo corretamente (Ex: RT-PF-...).";
        }
    } catch (error) {
        // 🚨 CENÁRIO 4: Falha na Internet
        caixaLaudo.style.display = 'block';
        caixaLaudo.style.borderLeftColor = "var(--vermelho-alerta)";
        caixaLaudo.style.boxShadow = "0 10px 30px rgba(239, 68, 68, 0.1)";
        document.querySelector('.laudo-titulo').innerHTML = '<i class="fa-solid fa-satellite-dish"></i> Erro de Comunicação Orbital';
        document.querySelector('.laudo-titulo').style.color = "var(--vermelho-alerta)";
        textoResultado.innerHTML = "O Satélite Cloudflare está inacessível neste momento devido a uma interferência de rede ou bloqueio de rota. Tente novamente em instantes.";
    } finally {
        // Devolve o botão ao normal
        btnBuscar.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Consultar Laudo';
        btnBuscar.disabled = false;
    }
}
</script>

</body>
</html>
